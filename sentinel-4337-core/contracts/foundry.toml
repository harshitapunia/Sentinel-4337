[profile.default]
src      = "src"
out      = "out"
libs     = ["lib"]
test     = "test"
cache    = true

# ── Solidity Compiler ──────────────────────────────────────────────────────────
solc_version = "0.8.28"

# ── Optimizer ─────────────────────────────────────────────────────────────────
optimizer        = true
optimizer_runs   = 200
via_ir           = false          # set to true if stack-too-deep errors arise

# ── Remappings ────────────────────────────────────────────────────────────────
remappings = [
  # OpenZeppelin
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",

  # Aave v3
  "@aave/core-v3/=lib/aave-v3-core/",
  "aave-v3-core/=lib/aave-v3-core/",

  # Uniswap v3
  "@uniswap/v3-core/=lib/v3-core/",
  "v3-core/=lib/v3-core/",

  # Chainlink
  "@chainlink/=lib/chainlink/contracts/src/",
  "chainlink/=lib/chainlink/",

  # Forge Standard Library
  "forge-std/=lib/forge-std/src/",
]

# ── EVM Version ───────────────────────────────────────────────────────────────
evm_version = "cancun"

# ── Fuzz Settings ─────────────────────────────────────────────────────────────
[fuzz]
runs = 1000

# ── Invariant Settings ────────────────────────────────────────────────────────
[invariant]
runs   = 256
depth  = 15

# See more config options:
# https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# ── Lint ──────────────────────────────────────────────────────────────────────
# block.timestamp usage is intentional in session key expiry logic.
[lint]
exclude_lints = ["block-timestamp"]
