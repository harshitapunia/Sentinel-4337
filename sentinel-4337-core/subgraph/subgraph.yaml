specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: SentinelVault
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: SentinelVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wash
      entities:
        - Vault
        - RescueEvent
      abis:
        - name: SentinelVault
          file: ./abis/SentinelVault.json
      eventHandlers:
        - event: LiquidationPrevented(indexed address,uint256,uint256)
          handler: handleLiquidationPrevented
      file: ./src/mapping.ts
